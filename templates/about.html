{% extends "base.html" %}

{% block title %}{{ page.title }} &ndash; {{ config.title }}{% endblock %}
{% block description %}{% if page.description %}{{ page.description }}{% else %}{{ config.description }}{% endif %}{% endblock %}

{% block content %}
<div class="container">
  <article class="about-content">
    {{ page.content | safe }}
  </article>
</div>
{% endblock %}
