<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="author" content="{{ config.extra.author }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="{{ config.title }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8E6DF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111110">
  <meta name="format-detection" content="telephone=no, date=no, address=no">
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ get_url(path=config.feed_filenames[0]) }}">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav__inner">
      <div class="site-nav__links">
        <span class="site-nav__indicator" aria-hidden="true"></span>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <button class="theme-btn site-nav__theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}

    <div class="container">
      <footer class="site-identity">
        <img src="/img/dexter-planning.gif" alt="{{ config.extra.author }}" class="site-identity__avatar">
        <p class="site-identity__name">{{ config.title }}</p>
        {% if config.extra.subtitle %}
        <p class="site-identity__subtitle">{{ config.extra.subtitle }}</p>
        {% endif %}
        <div class="site-identity__social">
          {% if config.extra.github %}
          <a href="{{ config.extra.github }}" target="_blank" rel="noopener">GitHub</a>
          {% endif %}
          {% if config.extra.linkedin %}
          <a href="{{ config.extra.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
          {% endif %}
        </div>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      // --- Theme toggle ---
      function applyTheme(next) {
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      }

      document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var next = (current || system) === 'dark' ? 'light' : 'dark';
          applyTheme(next);
        });
      });

      // --- Nav indicator ---
      var links = Array.prototype.slice.call(document.querySelectorAll('.site-nav__links a'));
      var indicator = document.querySelector('.site-nav__indicator');

      if (indicator && links.length) {
        function moveIndicator(el, animate) {
          var parent = el.parentElement;
          var pr = parent.getBoundingClientRect();
          var er = el.getBoundingClientRect();
          var pad = 10;
          if (!animate) indicator.style.transition = 'none';
          indicator.style.left = (er.left - pr.left - pad) + 'px';
          indicator.style.width = (er.width + pad * 2) + 'px';
          if (!animate) { indicator.getBoundingClientRect(); indicator.style.transition = ''; }
        }

        var path = window.location.pathname;
        var active = links[0];
        links.forEach(function (link) {
          var href = link.getAttribute('href');
          if (href !== '/' && path.startsWith(href)) active = link;
        });
        active.classList.add('active');
        moveIndicator(active, false);

        links.forEach(function (link) {
          link.addEventListener('click', function () { moveIndicator(this, true); });
        });
      }
    })();
  </script>

</body>
</html>
