<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="author" content="{{ config.extra.author }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ get_url(path=config.feed_filenames[0]) }}">
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

  <nav class="site-nav">
    <div class="site-nav__inner">
      <a href="{{ config.base_url }}" class="site-nav__brand">{{ config.title }}</a>

      <!-- Desktop links -->
      <div class="site-nav__links">
        <a href="/about">About</a>
        <a href="/posts">Writing</a>
        <a href="{{ config.extra.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button class="theme-btn site-nav__theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>

      <!-- Hamburger (mobile only) -->
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile full-screen menu -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <div class="mobile-menu__bar">
      <a href="{{ config.base_url }}" class="site-nav__brand">{{ config.title }}</a>
      <button class="mobile-menu__close" id="mobile-close" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="mobile-menu__body">
      <a href="/about">About</a>
      <a href="/posts">Writing</a>
      <a href="{{ config.extra.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>

    <div class="mobile-menu__footer">
      <button class="theme-btn site-nav__theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a href="{{ get_url(path=config.feed_filenames[0]) }}">RSS</a>
    </div>
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>© {{ now() | date(format="%Y") }} Alessandro Lo Prete</span>
      <a href="{{ get_url(path=config.feed_filenames[0]) }}">RSS</a>
    </div>
  </footer>

  <script>
    (function () {
      // --- Theme toggle ---
      function applyTheme(next) {
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      }

      document.querySelectorAll('.theme-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var next = (current || system) === 'dark' ? 'light' : 'dark';
          applyTheme(next);
        });
      });

      // --- Mobile menu ---
      var hamburger  = document.getElementById('hamburger');
      var mobileMenu = document.getElementById('mobile-menu');
      var closeBtn   = document.getElementById('mobile-close');

      function openMenu() {
        mobileMenu.classList.add('is-open');
        mobileMenu.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        mobileMenu.classList.remove('is-open');
        mobileMenu.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      hamburger.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);

      mobileMenu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', closeMenu);
      });
    })();
  </script>

</body>
</html>
