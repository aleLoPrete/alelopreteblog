{% extends "base.html" %}

{% block title %}Tags &ndash; {{ config.title }}{% endblock %}

{% block content %}
<div class="container">

  <div class="tags-page">
    <h1>Tags</h1>
    <div class="tags-grid">
      {% for term in terms %}
      <a href="{{ term.permalink }}" class="tag-pill">
        {{ term.name }}<span class="count">{{ term.pages | length }}</span>
      </a>
      {% endfor %}
    </div>
  </div>

</div>
{% endblock %}
