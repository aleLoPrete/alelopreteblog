{% extends "base.html" %}

{% block content %}
<div class="container">

  <section class="writing-section">
    {% set blog = get_section(path="posts/_index.md") %}
    <ul class="post-list">
      {% for page in blog.pages %}
      <li class="post-item">
        <div class="post-item__meta">
          <time datetime="{{ page.date | date(format='%Y-%m-%d') }}">{{ page.date | date(format="%Y %m %d") }}</time>
          {% if page.reading_time %}<span>· {{ page.reading_time }} min</span>{% endif %}
        </div>
        <a href="{{ page.permalink }}">{{ page.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </section>

</div>
{% endblock %}
